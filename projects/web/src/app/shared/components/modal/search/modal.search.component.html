<div class="modal-search-container">
  <div class="modal-search-wrapper">
    <app-input 
      display="inline" 
      width="long"
      [control]="searchValue"
      [error]="searchError"
    ></app-input>
    <img src="../../../../../assets/img/icon/icon-search.png" (click)="onSubmitSearch()">
  </div>
  <div class="modal-search-label" [ngSwitch]="searchError">
    <app-text textColor="error" textSize="xs" *ngSwitchCase="true">에러메세지</app-text>
    <app-text textColor="error" textSize="xs" *ngSwitchCase="false">&nbsp;</app-text>
  </div>
</div>
